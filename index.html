<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Max Tailors & Cloth</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111111, #292929);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            color: #222222;
            border-radius: 25px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        .logo {
            width: 95px;
            height: 95px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #111111;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        h1 {
            margin: 0;
            font-size: 27px;
        }

        .subtitle {
            margin: 10px 0 28px;
            color: #666666;
            font-size: 15px;
        }

        .social-button {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 14px 0;
            border-radius: 13px;
            color: white;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .social-button:hover {
            transform: scale(1.02);
        }

        .instagram {
            background: #E1306C;
        }

        .youtube {
            background: #FF0000;
        }

        .facebook {
            background: #1877F2;
        }

        .footer {
            margin-top: 25px;
            color: #888888;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            MAX
        </div>

        <h1>Max Tailors & Cloth</h1>

        <div class="subtitle">
            Follow us & stay connected
        </div>

        <a
            class="social-button instagram"
            href="https://www.instagram.com/max_tailors_cloth/"
            target="_blank">
            📸 Instagram
        </a>

        <a
            class="social-button youtube"
            href="https://youtube.com/@max_tailors_cloth"
            target="_blank">
            ▶️ YouTube
        </a>

        <a
            class="social-button facebook"
            href="https://www.facebook.com/share/1C38wYTezx/"
            target="_blank">
            👍 Facebook
        </a>

        <div class="footer">
            Thank you for supporting Max Tailors & Cloth ❤️
        </div>

    </div>

</body>
</html>
